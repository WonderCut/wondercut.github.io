<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Not for search engines: keep this site out of every index. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>Create an account — WonderCut</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" href="../icon.png" />
</head>
<body>
  <nav>
    <a class="brand" href="../"><img src="../icon.png" alt="" />WonderCut</a>
    <a href="../">Home</a>
    <a href="../features/">Features</a>
    <a href="../tiktok-integration/">TikTok Integration</a>
    <a href="../about/">About</a>
    <a href="../login/" class="nav-button" data-auth-nav>Log in</a>
  </nav>

  <div class="auth-box">
    <h1>Create your WonderCut account</h1>
    <p class="tagline">Join WonderCut. New accounts are activated in waves.</p>
    <form id="signup-form" class="auth-form">
      <label>Name<input type="text" name="name" autocomplete="name" maxlength="200" required /></label>
      <label>Email<input type="email" name="email" autocomplete="email" required /></label>
      <label>Password<input type="password" name="password" autocomplete="new-password" minlength="10" required />
        <span class="hint">At least 10 characters.</span></label>
      <label>Confirm password<input type="password" name="confirm" autocomplete="new-password" minlength="10" required /></label>
      <label class="check"><input type="checkbox" name="agree" value="1" required />
        <span>I agree to the <a href="../terms-of-service/">Terms of Service</a> and
        <a href="../privacy-policy/">Privacy Policy</a>.</span></label>
      <p class="form-error" role="alert"></p>
      <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="../login/">Log in</a></p>
  </div>

  <footer>
    WonderCut is independently developed.<br />
    <a href="../terms-of-service/">Terms of Service</a> &middot;
    <a href="../privacy-policy/">Privacy Policy</a> &middot;
    <a data-contact data-subject="WonderCut">Contact</a>
  </footer>
  <script src="../contact.js" defer></script>
  <script src="../auth.js" defer></script>
</body>
</html>
